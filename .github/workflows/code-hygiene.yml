---
name: Code Hygiene & Linter

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "packages/**"
      - "scripts/**"
      - "eslint.config.mjs"
      - "knip.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/code-hygiene.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Fast ESLint & Dead Code Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@4bc7feaddf28c5bc86464a95616682337750130f # v2.0.1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bunx eslint packages/

      - name: TypeScript Typecheck
        run: bunx tsc --noEmit
...
