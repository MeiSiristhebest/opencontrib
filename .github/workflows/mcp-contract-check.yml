---
name: OpenContrib MCP Contract Validation

on:
  pull_request:
    paths:
      - "packages/mcp-server/**"
      - "packages/core/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/mcp-contract-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-mcp:
    name: Validate 41 MCP Tools Schema Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Verify MCP Server Schema Definition
        run: bun run --filter @opencontrib/mcp build

      - name: Verify Canonical Protocol Documentation
        run: bun run docs:check

      - name: Run MCP Contract Tests
        run: bun test packages/mcp-server/tests/contract.test.ts --timeout 60000
...
