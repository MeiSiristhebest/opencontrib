name: CI

on:
  push:
    branches: [main, master]
    paths:
      - "packages/**"
      - "scripts/**"
      - "skills/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "README_zh.md"
      - "ARCHITECTURE.md"
      - "ARCHITECTURE_zh.md"
      - ".cursorrules"
      - ".cursor/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "turbo.json"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "packages/**"
      - "scripts/**"
      - "skills/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "README_zh.md"
      - "ARCHITECTURE.md"
      - "ARCHITECTURE_zh.md"
      - ".cursorrules"
      - ".cursor/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "turbo.json"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      run_network_tests:
        description: "Run opt-in live GitHub integration tests"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Bun Test & Typecheck (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      NODE_ENV: test
      OPENCONTRIB_OFFLINE: "1" # Required cached tests stay offline; use the manual opt-in job for network tests.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Restore Turborepo Cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'package.json', 'turbo.json', 'packages/**/package.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'package.json', 'turbo.json', 'packages/**/package.json') }}-
            ${{ runner.os }}-turbo-

      - name: TypeScript Typecheck
        run: bunx tsc --noEmit

      - name: Fetch full history for affected tests
        run: git fetch --unshallow origin

      - name: Run cached full workspace test suite
        run: bunx turbo run test:workspace:ci --concurrency=1 --log-order=stream

  network-integration:
    if: github.event_name == 'workflow_dispatch' && inputs.run_network_tests
    name: Opt-in GitHub Network Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      NODE_ENV: test
      OPENCONTRIB_NETWORK_TESTS: "1"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Run opt-in network integration suite
        run: bun run test:integration
