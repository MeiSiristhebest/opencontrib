name: CI

on:
  push:
    branches: [main, master]
    paths:
      - "packages/**"
      - "scripts/**"
      - "skills/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".cursorrules"
      - ".cursor/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "packages/**"
      - "scripts/**"
      - "skills/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".cursorrules"
      - ".cursor/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Bun Test & Typecheck (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript Typecheck
        run: bunx tsc --noEmit

      - name: Run Test Suite
        run: bun test --timeout 60000
        env:
          NODE_ENV: test
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
