name: CI

on:
  push:
    branches: [main, master]
    paths:
      - "packages/**"
      - "scripts/**"
      - "skills/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "README_zh.md"
      - "ARCHITECTURE.md"
      - "ARCHITECTURE_zh.md"
      - ".cursorrules"
      - ".cursor/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "turbo.json"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "packages/**"
      - "scripts/**"
      - "skills/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "README_zh.md"
      - "ARCHITECTURE.md"
      - "ARCHITECTURE_zh.md"
      - ".cursorrules"
      - ".cursor/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "turbo.json"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Bun Test & Typecheck (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      NODE_ENV: test
      OPENCONTRIB_OFFLINE: "1" # Keep cached unit tests deterministic; network tests remain opt-in.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Restore Turborepo Cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'package.json', 'turbo.json', 'packages/**/package.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'package.json', 'turbo.json', 'packages/**/package.json') }}-
            ${{ runner.os }}-turbo-

      - name: TypeScript Typecheck
        run: bunx tsc --noEmit

      - name: Run root script tests
        run: bun test scripts --timeout 60000

      - name: Run affected workspace tests (pull requests)
        if: github.event_name == 'pull_request'
        # Package suites share profile state; keep task execution serial and cache unchanged packages.
        run: bunx turbo run test:ci --affected --concurrency=1

      - name: Run full workspace test suite (main and manual runs)
        if: github.event_name != 'pull_request'
        run: bunx turbo run test:ci --concurrency=1
