name: Publish to NPM

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish.yml'
      - 'bun.lock'
      - 'package.json'
      - 'packages/core/**'
      - 'packages/mcp-server/**'
      - 'packages/cli/**'
  release:
    types: [ published ]
  workflow_dispatch:

concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Check package version
        id: mcp_pkg
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const packageJson = JSON.parse(readFileSync('packages/mcp-server/package.json', 'utf8'));
          const packageUrl = `https://registry.npmjs.org/${encodeURIComponent(packageJson.name)}/${encodeURIComponent(packageJson.version)}`;
          const response = await fetch(packageUrl, {
            signal: AbortSignal.timeout(15_000),
          });

          if (response.status !== 200 && response.status !== 404) {
            throw new Error(`npm registry returned HTTP ${response.status}`);
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `name=${packageJson.name}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${packageJson.version}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `published=${response.status === 200}\n`);
          NODE

      - name: Check CLI package version
        id: cli_pkg
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const packageJson = JSON.parse(readFileSync('packages/cli/package.json', 'utf8'));
          const packageUrl = `https://registry.npmjs.org/${encodeURIComponent(packageJson.name)}/${encodeURIComponent(packageJson.version)}`;
          const response = await fetch(packageUrl, {
            signal: AbortSignal.timeout(15_000),
          });

          if (response.status !== 200 && response.status !== 404) {
            throw new Error(`npm registry returned HTTP ${response.status}`);
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `name=${packageJson.name}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${packageJson.version}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `published=${response.status === 200}\n`);
          NODE

      - name: Setup Bun runtime
        if: steps.mcp_pkg.outputs.published == 'false' || steps.cli_pkg.outputs.published == 'false'
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf34f28c # v2.0.1
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.mcp_pkg.outputs.published == 'false' || steps.cli_pkg.outputs.published == 'false'
        run: bun install --frozen-lockfile

      - name: Run tests before publish
        if: steps.mcp_pkg.outputs.published == 'false' || steps.cli_pkg.outputs.published == 'false'
        run: bun test --timeout 60000

      - name: Build distribution bundles
        if: steps.mcp_pkg.outputs.published == 'false' || steps.cli_pkg.outputs.published == 'false'
        run: bun run build

      - name: Publish MCP Server to NPM
        if: steps.mcp_pkg.outputs.published == 'false'
        working-directory: packages/mcp-server
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish CLI to NPM
        if: steps.cli_pkg.outputs.published == 'false'
        working-directory: packages/cli
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish summary
        run: |
          if [ "${{ steps.mcp_pkg.outputs.published }}" = "true" ]; then
            echo "${{ steps.mcp_pkg.outputs.name }}@${{ steps.mcp_pkg.outputs.version }} is already published; skipping."
          else
            echo "Published ${{ steps.mcp_pkg.outputs.name }}@${{ steps.mcp_pkg.outputs.version }}."
          fi
          if [ "${{ steps.cli_pkg.outputs.published }}" = "true" ]; then
            echo "${{ steps.cli_pkg.outputs.name }}@${{ steps.cli_pkg.outputs.version }} is already published; skipping."
          else
            echo "Published ${{ steps.cli_pkg.outputs.name }}@${{ steps.cli_pkg.outputs.version }}."
          fi
